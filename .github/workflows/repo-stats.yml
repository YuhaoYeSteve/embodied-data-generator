name: Repository statistics

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: repository-statistics-main
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.event != 'pull_request_target')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Test statistics generator
        run: python3 -B -m unittest discover -s tests -p test_repo_stats.py
      - name: Sample GitHub metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/update_repo_stats.py --repo "$GITHUB_REPOSITORY"
      - name: Commit generated assets only
        run: |
          git add -- docs/assets/community/stats.json docs/assets/community/history.json docs/assets/community/stars.svg docs/assets/community/forks.svg docs/assets/community/watchers.svg docs/assets/community/issues.svg docs/assets/community/pull-requests.svg docs/assets/community/star-history.svg docs/assets/community/ci.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh repository statistics'
          git push origin HEAD:main
